# Lab inventory template. Copy to inventory.lab.conf (gitignored):
#
#   cp fstek_audit/config/inventory.lab.example.conf fstek_audit/config/inventory.lab.conf
#
# Set FSTEK_SSH_KEY in .env.local, then: ./fleet_lab.sh --class K3

FSTEK_FLEET_CLASS=K3
FSTEK_REMOTE_REPO=/opt/fstek-checks-2026
FSTEK_REMOTE_SUDO=true
FSTEK_SSH_USER=bob
FSTEK_SSH_PORT=22
FSTEK_SSH_AUTH=key
FSTEK_PING_TIMEOUT=3
FSTEK_SSH_CONNECT_TIMEOUT=15
FSTEK_FLEET_PARALLEL=0

# FSTEK_SSH_KEY is loaded from .env.local by fleet_lab.sh

# Stage 3: SFTP upload to central inbox (lab: same VM)
FSTEK_SFTP_ENABLED=true
FSTEK_SFTP_HOST=YOUR_VM_IP
FSTEK_SFTP_USER=bob
FSTEK_SFTP_PORT=22
FSTEK_SFTP_REMOTE_DIR=/home/bob/fstek-fleet-inbox
FSTEK_SFTP_AUTH=key
FSTEK_KEEP_LOCAL=true

FSTEK_FLEET_HOSTS=(
    "yc-lab|YOUR_VM_IP|bob"
)
