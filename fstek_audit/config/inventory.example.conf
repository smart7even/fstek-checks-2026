# Example fleet inventory for run_fleet.sh / fleet_check.sh
#
# Host line format (pipe-separated, trailing fields optional):
#   hostname|ip|user|port|remote_repo|ssh_key|password_env
#
# SSH auth (FSTEK_SSH_AUTH):
#   auto      - per host: key if configured and readable, else password env (default)
#   key       - key only (host ssh_key or global FSTEK_SSH_KEY)
#   password  - password env only (host password_env or global FSTEK_SSH_PASSWORD_ENV)
#
# Never store passwords in this file. Export passwords in the shell before run, e.g.:
#   export FSTEK_SSH_PASSWORD='...'
#   export FSTEK_PASS_VM2='...'
#
# Remote scan runs: sudo -n ./check_all.sh (FSTEK_REMOTE_SUDO=true by default).
# SSH user needs passwordless sudo for check_all.sh, or connect as root.
# Deploy repo to FSTEK_REMOTE_REPO and ensure the SSH user can read/execute it.

FSTEK_FLEET_CLASS=K3
FSTEK_REMOTE_REPO=/opt/fstek-checks-2026
FSTEK_REMOTE_SUDO=true
FSTEK_SSH_USER=fstek
FSTEK_SSH_PORT=22
FSTEK_SSH_AUTH=auto
# FSTEK_SSH_KEY=/home/operator/.ssh/fstek_fleet_rsa
# FSTEK_SSH_PASSWORD_ENV=FSTEK_SSH_PASSWORD
FSTEK_PING_TIMEOUT=2
FSTEK_SSH_CONNECT_TIMEOUT=10
# 0 = launch all hosts at once (fine for ~20-50 VMs on a typical controller)
FSTEK_FLEET_PARALLEL=0

FSTEK_FLEET_HOSTS=(
    # key auth via global FSTEK_SSH_KEY
    "vm1.example.com|10.0.0.11"
    # per-host key
    "vm2.example.com|10.0.0.12|fstek|22|/opt/fstek-checks-2026|/home/operator/.ssh/vm2_rsa"
    # password auth via env var FSTEK_PASS_VM3 (export before fleet_check.sh)
    "vm3.example.com|10.0.0.13|fstek|22|/opt/fstek-checks-2026|-|FSTEK_PASS_VM3"
)
