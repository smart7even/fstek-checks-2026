# Optional SFTP upload settings for fleet_check.sh / run_fleet.sh
#
# Include from inventory: . "$SCRIPT_DIR/config/sftp.example.conf"
# Or set in inventory.lab.conf / .env.local

FSTEK_SFTP_ENABLED=false
FSTEK_SFTP_HOST=
FSTEK_SFTP_USER=
FSTEK_SFTP_PORT=22
# FSTEK_SFTP_KEY=$HOME/.ssh/id_ed25519
# FSTEK_SFTP_PASSWORD_ENV=FSTEK_SFTP_PASSWORD
FSTEK_SFTP_AUTH=auto
FSTEK_SFTP_REMOTE_DIR=/home/bob/fstek-fleet-inbox
FSTEK_KEEP_LOCAL=true
