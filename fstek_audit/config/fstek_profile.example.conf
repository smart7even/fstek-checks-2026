# Copy to ./fstek_profile.conf or /etc/fstek-checks/profile.conf and edit locally.
# These flags are read-only expectations; they do not change system state.
FSTEK_EXPECT_WEB=false
FSTEK_EXPECT_API=false
FSTEK_EXPECT_CONTAINERS=false
FSTEK_EXPECT_VIRTUALIZATION=false
FSTEK_EXPECT_MAIL=false
FSTEK_EXPECT_WIRELESS=false
FSTEK_EXPECT_SIEM=false
FSTEK_EXPECT_AV=false
# Optional: pin expected AV product when auto-detect is ambiguous
# (clamav | kaspersky | kesl | drweb).
# FSTEK_EXPECT_AV_PRODUCT=kaspersky
# Optional: require SIEM forwarding to a specific collector (used by check_siem_forwarding).
# FSTEK_EXPECT_SIEM_HOST=siem.example.local
# FSTEK_EXPECT_SIEM_PORT=1468
